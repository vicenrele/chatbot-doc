[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "technical-documentation-rag"
version = "0.1.0"
description = "Local technical documentation chatbot with LangChain, FAISS, and Streamlit"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.8.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "langchain-ollama>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-text-splitters>=0.2.0,<1.0.0",
    "numpy<2.3",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: provider-backed tests requiring explicit credentials",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "ai-specs/skills/writing-skills/anthropic-best-practices.md",
    "packages/specboot/template/ai-specs/skills/writing-skills/anthropic-best-practices.md",
]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rag_chatbot"]
